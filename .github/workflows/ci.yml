name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout bindings
        uses: actions/checkout@v4

      - name: Checkout libopencie-pkcs11
        uses: actions/checkout@v4
        with:
          repository: M0Rf30/opencie-pkcs11
          path: opencie-pkcs11
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            libcrypto++-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpcsclite-dev libpng-dev libssl-dev libxml2-dev \
            ninja-build pkg-config python3-pip python3-venv

      - name: Install Meson
        run: |
          sudo pip3 install --upgrade 'meson>=1.3.0'
          meson --version

      - name: Build & install libopencie-pkcs11
        working-directory: opencie-pkcs11
        run: |
          meson setup builddir --buildtype=release --prefix=/usr
          meson compile -C builddir
          sudo meson install -C builddir
          sudo ldconfig

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          pip install -e .
          pip install pytest ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: pytest
        run: python -m pytest tests/ -v

      - name: Import smoke test
        run: python -c 'from opencie_pkcs11 import pkcs11, cie; print("OK")'