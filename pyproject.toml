[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencie-pkcs11"
version = "0.2.0"
description = "Python ctypes bindings for libopencie-pkcs11 — PKCS#11 interface for the Italian CIE smart card"
license = "MPL-2.0"
requires-python = ">=3.10"
keywords = ["pkcs11", "cie", "smartcard", "ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/M0Rf30/opencie-pkcs11-py"
Repository = "https://github.com/M0Rf30/opencie-pkcs11-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
